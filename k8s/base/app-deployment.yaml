apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: ticketing-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      containers:
        - name: app
          image: devops-ticketing-lab-app:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 5000
          envFrom:
            - secretRef:
                name: db-secret
          env:
            - name: DB_HOST
              value: db
