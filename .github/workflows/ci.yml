name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -v

  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t devops-ticketing-lab:ci .

      - name: Create CI environment
        run: |
          echo "POSTGRES_USER=ticketuser" >> .env
          echo "POSTGRES_PASSWORD=ci-password" >> .env
          echo "POSTGRES_DB=ticketdb" >> .env
          echo "POSTGRES_PORT=5432" >> .env

      - name: Start docker compose stack
        run: docker compose up -d --build

      - name: Smoke test
        run: curl --fail --retry 10 --retry-delay 2 --retry-all-errors http://localhost/health

      - name: Clean up docker compose
        if: always()
        run: docker compose down -v

  security-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pip audit
        run: pip-audit
