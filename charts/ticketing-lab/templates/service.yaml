apiVersion: v1
kind: Service
metadata:
  name: {{ include "ticketing-lab.fullname" . }}-app
  labels:
    {{- include "ticketing-lab.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "ticketing-lab.selectorLabels" . | nindent 4 }}
    component: app
  ports:
    - port: {{ .Values.app.containerPort }}
      targetPort: {{ .Values.app.containerPort }}
